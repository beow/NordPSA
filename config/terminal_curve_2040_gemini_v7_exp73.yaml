note_expansion: 'EXPANSIONSVARIANT av v7 (2026-08-20). Identisk med
  terminal_curve_2040_gemini_v7.yaml sa nar som pa anchor_eur_per_mwh, som ar 73
  LIKFORMIGT i stallet for dispatchens driftkorrigering 64,5-72,5.

  MOTIV: v7-filens egna ankare ar en DRIFTKORRIGERING for begransad framsyn i rullande
  horisont. Expansionen har cykliskt SOC och alltsa noll drift per konstruktion, sa
  korrigeringen saknar mening dar och skulle bli en artificiell zonskillnad i hydrons
  marginalkostnad. Facit (run320/run386) ger lambda konstant 72,87-73,02 i alla fem
  zoner. v7-filens egen not, rad 74, sager samma sak.

  ANVANDS SOM: --hydro-mc-curve config/terminal_curve_2040_gemini_v7_exp73.yaml

  ⛔ --terminal-anchor 73 gor INTE samma sak: den flaggan laser bara den rullande
  horisontens vag (run_model.py:915), medan --hydro-mc-curve (rad 2461) tar ankaret rakt
  ur filen via load_params(). Darfor behovs den har filen.'
