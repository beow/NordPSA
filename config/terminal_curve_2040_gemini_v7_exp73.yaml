note: 'LÅST 2026-08-20 (run391_v7_anchors_3h). Produktionskurva.


  PRODUKTIONSKANDIDAT v7, 2026-08-20. = v6 med b_amp LIKFORMIGT 0,27 (var 0,10-0,48).


  MOTIV: samma som for b_mean och lambda_bas. Facit (run386, run320) ger lambda konstant
  i

  BADE tid och fyllnadsgrad, sa vid optimum ar hela kurvformen noll -- det finns ingen

  UPPMATT zonskillnad att bevara, bara en gemensam avvikelse fran optimum som beror
  pa hur

  kort det rullande fonstret ser. Zonskillnaderna kom ur Geminis lambda-tabeller och
  har

  aldrig provats mot nagon oberoende observabel.


  PROVAT OCH FORKASTAT: b_amp som funktion av magasinstorleken. Fysiskt rimligt (ett
  litet

  magasin MASTE fyllas under floden, ett stort kan vanta) men data bar det inte: r
  = -0,60

  pa fem punkter, och SE-S faller helt ur monstret -- minsta magasinet av alla (3,5
  TWh,

  fyra manaders produktion) men b_amp 0,190, alltsa nast lagst. Log-log-lutningen
  blir

  -0,22, langt fran de -1 som b_amp ~ 1/volym kraver.


  NIVAN 0,27 = ENKELT medelvarde. Volym- och produktionsviktat ger 0,21, men de dras
  ned av

  NO-S (stort och lagst varde, 0,100) -- alltsa av just den zon vars varde vi beslutat
  att

  inte tro pa. Nar premissen ar att zonskillnaderna INTE ar verkliga ar varje zons
  tal en

  lika otillforlitlig observation av samma storhet, och da ar det enkla medlet ratt.


  VARNING: NO-S andras mest, 0,100 -> 0,27 (+170 %). Det ar den zon som enligt 2040-facit

  ska bara HELA Nordens sasongsbalansering (v/s 1,59 mot eSetts 1,30). Mat NO sarskilt.


  FRIHETSGRADER: a_scale (1) + b_amp (1) + lambda_bas (1) = TRE, alla globala.

  Lasta: b_mean 0,80 · alla sasongsfaser · hela x_ref · kvoten a_amp2/a_amp ·

  b_low_frac 1,0 · p_norm ''mid''.

  Ankaret likformigt 73. Dispatch med

  --terminal-anchor SE-N:66.5 SE-S:66.5 NO-N:69.1 NO-S:69.6 FI:70.5.


  ANKARE: de per-zons vardena ovan ar DRIFTKORRIGERINGEN for begransad framsyn,

  harledd ur run390:s drift. Spridningen 64,5-72,5 (1,12x) ar INTE ett pastaende om
  att

  vatten ar olika mycket vart i olika zoner -- facit (run386) ger 72,87 likformigt
  OCH

  noll drift, men en rullande horisont kan bara fa det ena av tva med ett enda tal.

  ⚠️ EXPANSION ska koras med 73 LIKFORMIGT (--terminal-anchor 73 eller --hydro-mc-curve

  mot en fil med 73): cykliskt SOC ger noll drift per konstruktion, sa korrigeringen

  saknar mening dar och skulle bli en artificiell zonskillnad i hydrons marginalkostnad.

  ⚠️ Kanslighetens tvapunktsskattning (run378 vs run379) visade sig 4x for LAG for
  SE-N

  (1,36 TWh per enhet, ej 0,343). Damp och taka alltid vid omkalibrering.

  ⚠️ SE ligger HELT utanfor EC-bandet (0 %) -- Sveriges magasin sitter ~5 pp under
  tionde

  percentilen. Kand oppen trad, forsamrad har mot run388:s 15 %.

  ⚠️ FI:s drift (-0,51) gar INTE att nolla med lambda_bas: kansligheten 0,069 kraver
  +9,0

  enheter, vilket vore 12 % avvikelse. Takat vid +2,0. Accepterad brist.'
