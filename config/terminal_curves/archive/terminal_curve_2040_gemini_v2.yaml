note: "PRODUKTIONSKANDIDAT v2, 2026-08-19. Efterföljare till terminal_curve_2040_gemini.yaml\
  \ (som ligger kvar LÅST och default tills v2 utvärderats — run316-385 reproduceras\
  \ oförändrat).\nTVÅ ÄNDRINGAR mot v1, båda mätta:\n  1. a_amp och a_amp2 HALVERADE\
  \ (x0,6 -> x0,3 av Geminis tabellvärden). Belagt av run384: SE:s v/s 1,18 -> 1,32,\
  \ Sigma|fel| 0,64 -> 0,50 mot eSett och 0,61 -> 0,56 mot 2040-facit (run386) - BÄST\
  \ PÅ BÅDA MÅLTAVLORNA. Marspuckeln, hela invändningen mot att sänka a_amp, slog\
  \ inte in: medelfel mot uppmätt 7,6 -> 6,4, bättre i fyra zoner av fem. Dessutom\
  \ planade lambda ut längs EC:s medianbana (kvot SE-N 2,08 -> 1,52), vilket är designmålet.\n\
  \  2. FI b_mean 1,038 -> 0,75. FI är ENDA zonen där båda måltavlorna pekar åt samma\
  \ håll (eSett 1,13, facit 0,97, modellen 0,74) och run386 bevisar att 0,97 är UPPNÅELIGT\
  \ med exakt denna flotta och detta magasin - alltså inget fysiskt tak. a_amp är\
  \ mätt trögast av alla i FI (gradient -0,13; run384 gav +0,02, run385 +0,05), så\
  \ b_mean är den enda spaken kvar. Riktningen ur eSett-svepen: b_mean UPP => v/s\
  \ NED (0,9 -> 2,5 sänkte NO 1,98 -> 1,30).\n  ⚠️ FI:s b_mean 0,75 är ETT STEG, inte\
  \ ett anpassat värde - ingen gradient finns mätt för b_mean -> v/s i den här kurvfamiljen.\
  \ Bevaka att FI-magasinet inte bottnar: en flackare kurva dränerar djupare, och\
  \ NO-N med b_mean 1 gick INFEASIBLE i tvålutningssvepet.\nOFÖRÄNDRAT: x_ref (säsongsreferensen),\
  \ b_amp/b_peak, a_peak, p_norm mid, b_low_frac 1,0.\n⚠️ ANKARET ÄR LIKFORMIGT 73\
  \ MED FLIT. Facit (run386) ger vattenvärdet 72,87 EUR/MWh i ALLA fem zoner och alla\
  \ timmar - en replikering av run320:s 73,02 på en annan flotta. Per-zons nivåer\
  \ vore dubbelräkning av trängsel modellen redan producerar endogent. Den rullande\
  \ horisontens DRIFTkorrigering hör till körningen, inte till filen (se run_model.py):\
  \ kör dispatch med --terminal-anchor SE-N:66.5 SE-S:66.5 NO-N:69.1 NO-S:69.6 FI:70.5,\
  \ härlett ur den uppmätta känsligheten run378 vs run379 (TWh drift per enhet lambda_bas:\
  \ NO-S 1,21, NO-N 0,41, SE-N 0,34, FI 0,069, SE-S 0,039), dämpat 0,8 och TAKAT vid\
  \ +-2,0 - de två små magasinen SE-S och FI kräver -6,1 respektive +7,2 för nolldrift,\
  \ vilket lambda_bas inte är rätt instrument för. EXPANSION körs med 73 rakt av:\
  \ cykliskt SOC ger noll drift per konstruktion, så korrigeringen saknar mening där."
