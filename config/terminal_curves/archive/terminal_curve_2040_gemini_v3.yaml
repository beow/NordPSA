note: '⛔ FORKASTAD 2026-08-20 (run389). x_ref_weekly, 52 fria varden ur EC-medianen.
  EXAKT som beskrivning (RMS 0) men forbattrade INGENTING: v/s +-0,02, poang 0,625->0,664,
  prisform 7,26->8,52. Sankte dessutom lambda langs HELA banan ~3 %, sa testet konfunderades
  av ett nivaskifte. Ersatt av v4 (tva harmoniska), som tar 92-98 % av anpassningen
  med fem parametrar i stallet for 52. Behalls for att reproducera run389.


  --- ursprunglig anteckning ---

  PRODUKTIONSKANDIDAT v3, 2026-08-20. = v2 (a_amp x0,3, FI b_mean 0,75) PLUS empirisk

  referensbana x_ref_weekly: 52 uppmatta veckovarden ur EC:s magasinmedian 2014-2026,

  som ERSATTER kosinusen c_mid/c_amp/c_peak (de star kvar i filen men anvands inte).


  MOTIV, matt 2026-08-20: kosinusanpassningen har R2 0,92 (SE) / 0,95 (NO) / 0,64
  (FI)

  och en SYSTEMATISK residual med samma teckenmonster i alla tre landerna -- jan-feb

  +3..+4,5 pp, mars-apr -3..-9,7, sep-okt -3..-5,3. Orsaken ar att den verkliga banan
  ar

  ASYMMETRISK (langsam vinteravtappning, brant fall i mars-april, snabb flodfyllning,

  sen hostplata) medan en kosinus per definition ar symmetrisk. Fel funktionsfamilj
  --

  ingen amplitud eller fas kan laga det.


  KONSEKVENSEN ar riktad: i mars-april ligger uppmatt fyllnad UNDER kosinusen, sa
  kurvan

  tror att normallaget ar hogre an det ar, (x - x_ref) blir for negativt och

  exp(-b(x-x_ref)) FOR STORT. Kurvan blaser alltsa upp lambda ~5 % i SE (4 EUR/MWh)
  och

  7,5 % i FI (5,5 EUR/MWh) just den arstid marspuckeln bor i. Hypotes att prova: restfelet

  i marspuckeln (run388 SE-N -11,4 mot uppmatta -4,9) ar kosinusens egen skevhet.


  FI ar dar argumentet ar starkast: R2 0,64 ar ingen anpassning vard namnet, max|fel|

  13,6 pp, och FI ar den zon som varit okanslig for allt vi provat (fyra spakar).
  Ligger

  x_ref 10 pp fel i april far b fel avvikelse att reagera pa, och da hjalper ingen
  b_mean.


  VARNING: banan ar EC:s median per LAND, sa SE-N/SE-S delar bana och NO-N/NO-S delar

  bana -- exakt som kosinusen gjorde (c_amp/c_mid/c_peak var ocksa landsvisa). Zonvis

  uppdelning finns inte i EC-datan.

  VARNING: 52 fria varden riskerar att lasa modellen vid just dessa tolv ars klimatologi.

  Det ar dock SAMMA data som kosinusen anpassades mot -- friheten okar inte, den slutar

  bara kasta bort information genom en form som matbart inte passar.


  Ankaret ar likformigt 73 av samma skal som i v2 (facit run386 ger 72,87 i alla zoner).

  Dispatch kors med --terminal-anchor SE-N:66.5 SE-S:66.5 NO-N:69.1 NO-S:69.6 FI:70.5.'
