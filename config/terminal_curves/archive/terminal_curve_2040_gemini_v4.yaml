note: "PRODUKTIONSKANDIDAT v4, 2026-08-20. = v2 (a_amp x0,3, FI b_mean 0,75) med en\
  \ ANDRA\nHARMONISK pa referensbanan: x_ref(v) = c_mid + c_amp*cos(2pi(v-c_peak)/52)\n\
  \                                              + c_amp2*cos(4pi(v-c_peak2)/52).\n\
  \nMOTIV: den rena kosinusen ar SYMMETRISK medan den verkliga magasinbanan har ett\
  \ KNA --\nfyllningen startar abrupt (FI v17, SE v19) och gar nastan rakt upp i fem-sex\
  \ veckor,\noch hostplatan ar bred och sen. Residualen mot EC:s median 2014-2026\
  \ var systematisk,\n+-8-12 pp med teckenbyte vid knaet. Andra harmoniskan halverar\
  \ felet:\n    R2 / RMS   SE 0,923->0,980 (5,7->2,9 pp) · NO 0,948->0,984 (3,9->2,2\
  \ pp) ·\n               FI 0,642->0,919 (7,0->3,3 pp)   <- storst dar den behovs\
  \ mest\n\nVARFOR INTE x_ref_weekly (v3, 52 fria varden): v3 var EXAKT men forbattrade\
  \ ingenting\n(run389 mot run388: v/s +-0,02, poang 0,625->0,664, prisform 7,26->8,52).\
  \ Den sankte\ndessutom lambda langs HELA banan ~3 %, sa testet konfunderades av\
  \ ett nivaskifte.\nTva harmoniska tar 92-98 % av forbattringen med fem parametrar\
  \ i stallet for 52, later\nkurvan forbli en slat funktion, och undviker att lasa\
  \ modellen vid tolv ars brus.\nTredje harmoniska ger ytterligare ~1,5 pp men borjar\
  \ anpassa sig till bruset.\n\nBasen ar ORTOGONAL pa 52-punktsrutnatet: de anpassade\
  \ forsta-harmoniska vardena blir\nexakt dagens (SE c_mid 0,6143 / c_amp 0,2800 /\
  \ c_peak 39,3), och c_amp2 = 0 ger\nbit-identiskt med v1/v2. Samma egenskap som\
  \ a_amp2 har for nivafaktorn.\n\nVARNING: EC:s median finns bara PER LAND, sa SE-N/SE-S\
  \ delar bana och NO-N/NO-S delar\nbana -- samma begransning som den enkla kosinusen\
  \ hade.\nAnkaret likformigt 73 (facit run386: 72,87 i alla zoner). Dispatch med\n\
  --terminal-anchor SE-N:66.5 SE-S:66.5 NO-N:69.1 NO-S:69.6 FI:70.5."
