  LAST) med

  b_mean LIKFORMIGT 0,80 i alla zoner, i stallet for 0,64-1,00 ur Geminis tabeller.


  MOTIV, samma som for likformigt lambda_bas men STARKARE: i facit (run386, run320)
  beror

  lambda INTE ALLS pa fyllnadsgraden -- den ar konstant 72,87 EUR/MWh i alla zoner
  och

  alla timmar. Vid optimum ar b alltsa NOLL. b existerar uteslutande som en anordning
  for

  BEGRANSAD FRAMSYN, som ska ersatta den framsyn det rullande fonstret saknar. Det
  finns

  darfor inget ''sant'' zonvist b att mata upp; differentieringen kom enbart ur Geminis

  tabeller och har aldrig provats mot nagon oberoende observabel.


  NIVAN 0,80 ar robust mot viktning: enkelt medel 0,818, volymviktat 0,802,

  produktionsviktat 0,800. Att valet av vikt knappt spelar roll ar ett gott tecken.


  STORSTA FORANDRINGARNA: NO-S 0,641 -> 0,80 (+25 %) och NO-N 0,998 -> 0,80 (-20 %).

  VARNING: NO-S ar den zon som enligt 2040-facit ska bara HELA Nordens sasongsbalansering

  (v/s 1,59 mot eSetts 1,30), sa att gora dess knapphetssvar 25 % hardare ar inte
  en

  kosmetisk andring. Mat NO sarskilt.


  OPPNA FRIHETSGRADER EFTER v5: a_amp (+a_amp2), b_amp, lambda_bas. b_mean och alla

  sasongsfaser (a_peak, a_peak2, b_peak) samt hela x_ref ar lasta.

