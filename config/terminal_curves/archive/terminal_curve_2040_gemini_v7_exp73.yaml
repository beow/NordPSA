note: 'LÅST 2026-08-20 (run391_v7_anchors_3h). Produktionskurva.


  PRODUKTIONSKANDIDAT v7, 2026-08-20. = v6 med b_amp LIKFORMIGT 0,27 (var 0,10-0,48).


  MOTIV: samma som for b_mean och lambda_bas. Facit (run386, run320) ger lambda konstant i

  BADE tid och fyllnadsgrad, sa vid optimum ar hela kurvformen noll -- det finns ingen

  UPPMATT zonskillnad att bevara, bara en gemensam avvikelse fran optimum som beror pa hur

  kort det rullande fonstret ser. Zonskillnaderna kom ur Geminis lambda-tabeller och har

  aldrig provats mot nagon oberoende observabel.


  PROVAT OCH FORKASTAT: b_amp som funktion av magasinstorleken. Fysiskt rimligt (ett litet

  magasin MASTE fyllas under floden, ett stort kan vanta) men data bar det inte: r = -0,60

  pa fem punkter, och SE-S faller helt ur monstret -- minsta magasinet av alla (3,5 TWh,

  fyra manaders produktion) men b_amp 0,190, alltsa nast lagst. Log-log-lutningen blir

  -0,22, langt fran de -1 som b_amp ~ 1/volym kraver.


  NIVAN 0,27 = ENKELT medelvarde. Volym- och produktionsviktat ger 0,21, men de dras ned av

  NO-S (stort och lagst varde, 0,100) -- alltsa av just den zon vars varde vi beslutat att

  inte tro pa. Nar premissen ar att zonskillnaderna INTE ar verkliga ar varje zons tal en

  lika otillforlitlig observation av samma storhet, och da ar det enkla medlet ratt.


  VARNING: NO-S andras mest, 0,100 -> 0,27 (+170 %). Det ar den zon som enligt 2040-facit

  ska bara HELA Nordens sasongsbalansering (v/s 1,59 mot eSetts 1,30). Mat NO sarskilt.


  FRIHETSGRADER: a_scale (1) + b_amp (1) + lambda_bas (1) = TRE, alla globala.

  Lasta: b_mean 0,80 · alla sasongsfaser · hela x_ref · kvoten a_amp2/a_amp ·

  b_low_frac 1,0 · p_norm ''mid''.

  Ankaret likformigt 73. Dispatch med

  --terminal-anchor SE-N:66.5 SE-S:66.5 NO-N:69.1 NO-S:69.6 FI:70.5.


  ANKARE: de per-zons vardena ovan ar DRIFTKORRIGERINGEN for begransad framsyn,

  harledd ur run390:s drift. Spridningen 64,5-72,5 (1,12x) ar INTE ett pastaende om att

  vatten ar olika mycket vart i olika zoner -- facit (run386) ger 72,87 likformigt OCH

  noll drift, men en rullande horisont kan bara fa det ena av tva med ett enda tal.

  ⚠️ EXPANSION ska koras med 73 LIKFORMIGT (--terminal-anchor 73 eller --hydro-mc-curve

  mot en fil med 73): cykliskt SOC ger noll drift per konstruktion, sa korrigeringen

  saknar mening dar och skulle bli en artificiell zonskillnad i hydrons marginalkostnad.

  ⚠️ Kanslighetens tvapunktsskattning (run378 vs run379) visade sig 4x for LAG for SE-N

  (1,36 TWh per enhet, ej 0,343). Damp och taka alltid vid omkalibrering.

  ⚠️ SE ligger HELT utanfor EC-bandet (0 %) -- Sveriges magasin sitter ~5 pp under tionde

  percentilen. Kand oppen trad, forsamrad har mot run388:s 15 %.

  ⚠️ FI:s drift (-0,51) gar INTE att nolla med lambda_bas: kansligheten 0,069 kraver +9,0

  enheter, vilket vore 12 % avvikelse. Takat vid +2,0. Accepterad brist.'
note_expansion: "EXPANSIONSVARIANT av v7 (2026-08-20). Identisk med terminal_curve_2040_gemini_v7.yaml\
  \ sa nar som pa anchor_eur_per_mwh, som ar 73 LIKFORMIGT i stallet for dispatchens driftkorrigering\
  \ 64,5-72,5.\nMOTIV: v7-filens egna ankare ar en DRIFTKORRIGERING for begransad framsyn i rullande horisont.\
  \ Expansionen har cykliskt SOC och alltsa noll drift per konstruktion, sa korrigeringen saknar mening\
  \ dar och skulle bli en artificiell zonskillnad i hydrons marginalkostnad. Facit (run320/run386) ger\
  \ lambda konstant 72,87-73,02 i alla fem zoner. v7-filens egen not, rad 74, sager samma sak.\nANVANDS\
  \ SOM: --hydro-mc-curve config/terminal_curve_2040_gemini_v7_exp73.yaml\n⛔ --terminal-anchor 73 gor\
  \ INTE samma sak: den flaggan laser bara den rullande horisontens vag (run_model.py:915), medan --hydro-mc-curve\
  \ (rad 2461) tar ankaret rakt ur filen via load_params(). Darfor behovs den har filen.\n\n⭐⭐⭐ LAMBDA_BAS\
  \ LAST FOR EXPANSION 2026-08-22: 73 LIKFORMIGT. Inte langre en fri parameter.\nGRUND: lambda_bas ar\
  \ den ENDA av kurvans tre globala frihetsgrader som ar MATT i expansionens\neget regim. a_scale 0,30\
  \ och b_amp 0,27 ar anpassade (mot eSett resp. Geminis tabeller);\nlambda_bas ar AVLAST ur facit run320\
  \ (73,02 i alla fem zoner och alla 13 152 timmar) och\nrun386 (72,87). Facit ar en cyklisk fullframsynskorning\
  \ = samma regim som expansionen.\n\n⛔ SVEPETS 68,5 FAR INTE FOLJA MED. run378/379/380 valde 68,5 pa\
  \ RESERVOARDRIFTEN, som ar\nexakt 3x det arliga flodesunderskottet (samma matning, inte tva). Cykliskt\
  \ SOC tvingar\nstart = slut, sa driften ar IDENTISKT NOLL oavsett lambda_bas -- observabeln som pekade\
  \ ut\n68,5 finns inte i expansion. Samma skal som utestanger de zonvisa ankarna 64,5-72,5.\n\nNIVAN\
  \ ar dessutom nara inert: run273-276 (p_nom_opt orort mellan VOM/30/60) och run377\n(mc 27-58 -> 73,\
  \ my 44,1 -> 1,1, effektivt bud andrat <3 EUR/MWh i alla fem zoner).\n⚠️ MEN INTE HELT: kurvan ar MULTIPLIKATIV,\
  \ mc = lambda_bas*A(v), sa lambda_bas skalar\nsasongsamplituden i absoluta tal, och run381 visade att\
  \ FORMEN inte ar inert (platt A(v):\nsol +5,5 GW, havsvind -1,0 GW). 68,5 mot 73 = 6,6 % amplitudskillnad,\
  \ andra ordningen mot\na_scale 0,6->0,3 (50 %), men inte noll. Pasta aldrig att lambda_bas ar verkningslos\
  \ har.\n\n✅ BEKRAFTAT PA DET LASTA NATET 2026-08-22 -- UTAN NY KORNING. Fragan var om 73, matt pa\n\
  det gamla natet (run320), overlever NTC-andringarna 2026-08-20 och 2026-08-22. Svaret ligger\ni tva\
  \ befintliga facit-korningar pa OLIKA nat (NTC lasta direkt ur network.nc, ej ur minnet):\n\n  korning\
  \   NO-N->SE-N  NO-N->NO-S  NO-N export  summa interna  lambda    uppl.\n  run320          1836    \
  \    1773         3609              -   73,02      2h\n  run386          1500         700         2200\
  \         22 281   72,869     3h\n  IDAG            1800        1500         3300         23 181   ?\
  \          -\n\n1. lambda ar nastan OKANSLIGT for NTC: NO-N:s export skars 3609 -> 2200 (-39 %) och\
  \ lambda\n   rorde sig 0,15 enheter (-0,2 %). Tva helt olika nat, samma svar.\n2. Dagens nat ligger\
  \ INUTI intervallet de tva spanner upp (NO-N export 3300 mellan 2200 och\n   3609) -- interpolation,\
  \ inte extrapolation.\n3. Dagens nat ligger dessutom MYCKET nara run386:s: +900 MW totalt (+4,0 %),\
  \ och den storsta\n   enskilda andringen (NO-N<->NO-S 700 -> 1500) gor lambda MER utjamnad, inte mindre.\n\
  \   run386 matte 72,87 pa det SNAVARE natet.\n\nrun386:s water_value.csv ger EXAKT ETT varde, 72,869,\
  \ i alla fem zoner och alla timmar.\n⭐ Invariansen spanner ocksa en upplosningsandring (run320 2h, run386\
  \ 3h) -- stod for att\n  aven 4h skulle ge samma niva.\n\n⇒ 73 STAR. Om nagot ligger sanningen marginellt\
  \ under (72,87-73,02), men skillnaden ar under\nen tiondels enhet och langt under upplosningen i kurvans\
  \ ovriga frihetsgrader.\n\n⚠️ Vad som INTE ar bevisat: att lambda forblir likformig ACROSS ZONES om\
  \ nordliga NTC skulle\nsankas VASENTLIGT under run386:s niva. Bada facit-korningarna gav likformigt\
  \ lambda, men bada\nlag i 2040-regimen. Se project-lambda-selection-effect: platt lambda ar betingat\
  \ pa att natet\nar utbyggt. Skulle NO-N<->NO-S ga tillbaka mot nutidens 700 i ett framtida scenario\
  \ maste\ndetta mataas om."
