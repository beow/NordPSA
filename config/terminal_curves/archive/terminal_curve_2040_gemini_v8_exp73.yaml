note: "PRODUKTIONSKURVA v8, 2026-08-25. = v7 med b_mean 2,0 likformigt (var 0,80).\n\
  ENDA fältet som skiljer mot v7; alla ankare, faser, x_ref och a_scale ar ororda.\n\
  \nGRUND: B - vattenvardets svar pa magasinets AVVIKELSE fran normalbanan - mattes\n\
  icke-cirkulart mot EC:s magasindata och ENTSO-E-priser 2015-2025 (11 ar, n=573/zon):\n\
  \n    ln P(v) = ar_FE + sasong(2 harmoniska) - B*dev(v),\n    dev(v)  = fyllnadsgrad(v)\
  \ - EC:s medianfyllnad for samma ISO-vecka\n\nArsdummyn absorberar NIVAN (gaspris,\
  \ torrar, krisar), sasongstermerna arsgangen; B\nidentifieras ur variationen INOM\
  \ aret. Samma regression pa modellens prices.csv +\nhydro_soc.csv med EC:s median\
  \ som referens ger direkt jamforbara koefficienter.\n\n  UPPMATT 2015-2025   SE-N\
  \ 3,27  SE-S 1,53  NO-N 2,74  NO-S 2,85  FI 1,71\n  MODELL vid b_mean 0,80 (run428)\
  \  0,71  0,68  0,46  0,24  3,11\n  MODELL vid b_mean 2,00 (run429)  1,17  1,08 \
  \ 1,16  0,77  3,56\n\nSVEPET (run428/429/430 = b_mean 0,80/2,0/4,0, 3h-dispatch\
  \ av run420_baseline_2h,\nidentiska utom kurvfilen):\n\n  kriterium            \
  \  0,80        2,0        4,0     mal\n  Sum|fel| B             9,70       8,06\
  \       6,14     0\n  budkurva 20-60        3,411      3,012      2,202     min\
  \   <- kalibreringsmalet\n  budkurva hela         2,199      1,961      1,928  \
  \   min\n  i EC-band SE          1,9 %     94,2 %     100 %     max\n  i EC-band\
  \ NO         61,5 %     88,5 %    94,2 %     max\n  i EC-band FI         40,4 %\
  \     63,5 %    69,2 %     max\n  v/s SE/NO/FI    1,358/1,313/0,809  1,418/1,258/0,738\
  \  1,486/1,197/0,708\n  Sum|fel| v/s          0,356      0,471      0,631     0\n\
  \  drift TWh             -0,48      +3,06      +4,09    +3,13  <- se nedan\n  poang\
  \ score()         0,577      0,522      0,660     min\n\nVARFOR 2,0 OCH INTE 4,0:\
  \ 2,0 ar minimum pa score(), tar 94 % av SE:s bandvinst och\nforbattrar bade budkurvan\
  \ och B, till en mattlig v/s-kostnad. 4,0 koper mer av de tva\nsom pekar uppat men\
  \ kostar v/s hart och overskjuter nordens prissvans mot uppmatt\n(h>100: SE-N 3246\
  \ mot uppmatta 828, NO-N 3027 mot 320).\n\nDRIFTMALET AR INTE NOLL. EC:s uppmatta\
  \ lager vaxte +3,13 TWh over korfonstret\n(2023-01-02 -> 2025-12-31; SE +2,24, NO\
  \ +0,70, FI +0,19). Perioden ar alltsa inte\nlagerneutral i verkligheten - den borjar\
  \ pa ett lagt 2023 och slutar hogt. run429\nmissar med 0,07 TWh, run428 med 3,61.\
  \ Noll galler bara CYKLISKA korningar.\nVARNING: totalen traffar delvis genom utjamning\
  \ - SE 1,86 mot 2,24, NO 1,70 mot 0,70,\nFI -0,49 mot +0,19 (fel tecken). Landvis\
  \ ar driften inte lost.\n\nFORKASTAT (run431/432): ankarna driftkorrigerade med\
  \ -drift/1,9 per zon. Kansligheten\ni brant regim ar 0,37 TWh/enhet i SE-N och NO-S\
  \ och ~0 i ovriga, alltsa 5x lagre an de\n1,9 som mattes vid b_mean 0,80 - en brant\
  \ kurva pinnar SOC mot x_ref och nivaspaken\ntappar greppet. Skiftet rorde inte\
  \ heller v/s (0,4714 -> 0,4686), sa v/s-forlusten ar\nAKTA och inte hamstringens\
  \ skugga.\n\nOPPET: FI gar AT FEL HALL. Modellens FI-B ar redan 3,11 mot uppmatta\
  \ 1,71 och stiger\ntill 3,56 vid b_mean 2,0; linjar extrapolation kraver b_mean\
  \ -3,0. FI ar for KANSLIGT,\ninte for trogt. Ett zonvist FI-varde ar naturlig nasta\
  \ fraga.\nOPPET: B ar kraftigt SUBLINJART - 5x b_mean ger bara 2,5-6x B. Att na\
  \ uppmatt niva\nskulle krava b_mean 3,7 (SE-S) till 8,3 (SE-N). Systemet dampar;\
  \ kurvan ensam racker\ninte.\nOPPET: v/s-forlusten. run428:s v/s ar dock \"ratt\"\
  \ pa en SOC-bana som ligger UTANFOR\nEC-bandet 98 % av veckorna, och v/s-malet ar\
  \ eSett i DAGENS system medan modellen kor\n2040 - samma varldsinvandning som budkurvan\
  \ bar.\n\nMATVERKTYG: temp/measure_b.py (B-regressionen), temp/fetch_hist_prices.py\n\
  (ENTSO-E 2015-2025 -> temp/zone_prices_hist.parquet), temp/eval_bmean_sweep.py.\n\
  v7 ligger kvar for att reproducera run316-run432 - namnge den da explicit.\n\nOBS\
  \ FOR EXPANSIONSVARIANTEN: b_mean ar INERT har. hydro_mc_from_curve() satter\nhydrons\
  \ marginal_cost langs NORMALBANAN, dar P(x_ref) = 1 per konstruktion, sa\nmc = lambda_bas*A(v)\
  \ oberoende av b. (Det maste vara sa: mc = lambda(v, SOC) vore\nbilinjart och inte\
  \ langre ett LP.) b_mean 2,0 star har enbart for att filen ska\nforbli 'identisk\
  \ med v8 sa nar som pa ankaret'. Svepet run428-432 ar dispatch.\n\n--- v7:s not,\
  \ bevarad ---\nLÅST 2026-08-20 (run391_v7_anchors_3h). Produktionskurva.\n\nPRODUKTIONSKANDIDAT\
  \ v7, 2026-08-20. = v6 med b_amp LIKFORMIGT 0,27 (var 0,10-0,48).\n\nMOTIV: samma\
  \ som for b_mean och lambda_bas. Facit (run386, run320) ger lambda konstant i\n\
  BADE tid och fyllnadsgrad, sa vid optimum ar hela kurvformen noll -- det finns ingen\n\
  UPPMATT zonskillnad att bevara, bara en gemensam avvikelse fran optimum som beror\
  \ pa hur\nkort det rullande fonstret ser. Zonskillnaderna kom ur Geminis lambda-tabeller\
  \ och har\naldrig provats mot nagon oberoende observabel.\n\nPROVAT OCH FORKASTAT:\
  \ b_amp som funktion av magasinstorleken. Fysiskt rimligt (ett litet\nmagasin MASTE\
  \ fyllas under floden, ett stort kan vanta) men data bar det inte: r = -0,60\npa\
  \ fem punkter, och SE-S faller helt ur monstret -- minsta magasinet av alla (3,5\
  \ TWh,\nfyra manaders produktion) men b_amp 0,190, alltsa nast lagst. Log-log-lutningen\
  \ blir\n-0,22, langt fran de -1 som b_amp ~ 1/volym kraver.\n\nNIVAN 0,27 = ENKELT\
  \ medelvarde. Volym- och produktionsviktat ger 0,21, men de dras ned av\nNO-S (stort\
  \ och lagst varde, 0,100) -- alltsa av just den zon vars varde vi beslutat att\n\
  inte tro pa. Nar premissen ar att zonskillnaderna INTE ar verkliga ar varje zons\
  \ tal en\nlika otillforlitlig observation av samma storhet, och da ar det enkla\
  \ medlet ratt.\n\nVARNING: NO-S andras mest, 0,100 -> 0,27 (+170 %). Det ar den\
  \ zon som enligt 2040-facit\nska bara HELA Nordens sasongsbalansering (v/s 1,59\
  \ mot eSetts 1,30). Mat NO sarskilt.\n\nFRIHETSGRADER: a_scale (1) + b_amp (1) +\
  \ lambda_bas (1) = TRE, alla globala.\nLasta: b_mean 0,80 · alla sasongsfaser ·\
  \ hela x_ref · kvoten a_amp2/a_amp ·\nb_low_frac 1,0 · p_norm 'mid'.\nAnkaret likformigt\
  \ 73. Dispatch med\n--terminal-anchor SE-N:66.5 SE-S:66.5 NO-N:69.1 NO-S:69.6 FI:70.5.\n\
  \nANKARE: de per-zons vardena ovan ar DRIFTKORRIGERINGEN for begransad framsyn,\n\
  harledd ur run390:s drift. Spridningen 64,5-72,5 (1,12x) ar INTE ett pastaende om\
  \ att\nvatten ar olika mycket vart i olika zoner -- facit (run386) ger 72,87 likformigt\
  \ OCH\nnoll drift, men en rullande horisont kan bara fa det ena av tva med ett enda\
  \ tal.\n⚠️ EXPANSION ska koras med 73 LIKFORMIGT (--terminal-anchor 73 eller --hydro-mc-curve\n\
  mot en fil med 73): cykliskt SOC ger noll drift per konstruktion, sa korrigeringen\n\
  saknar mening dar och skulle bli en artificiell zonskillnad i hydrons marginalkostnad.\n\
  ⚠️ Kanslighetens tvapunktsskattning (run378 vs run379) visade sig 4x for LAG for\
  \ SE-N\n(1,36 TWh per enhet, ej 0,343). Damp och taka alltid vid omkalibrering.\n\
  ⚠️ SE ligger HELT utanfor EC-bandet (0 %) -- Sveriges magasin sitter ~5 pp under\
  \ tionde\npercentilen. Kand oppen trad, forsamrad har mot run388:s 15 %.\n⚠️ FI:s\
  \ drift (-0,51) gar INTE att nolla med lambda_bas: kansligheten 0,069 kraver +9,0\n\
  enheter, vilket vore 12 % avvikelse. Takat vid +2,0. Accepterad brist."
note_expansion: "EXPANSIONSVARIANT av v7 (2026-08-20). Identisk med terminal_curve_2040_gemini_v7.yaml\
  \ sa nar som pa anchor_eur_per_mwh, som ar 73 LIKFORMIGT i stallet for dispatchens\
  \ driftkorrigering 64,5-72,5.\nMOTIV: v7-filens egna ankare ar en DRIFTKORRIGERING\
  \ for begransad framsyn i rullande horisont. Expansionen har cykliskt SOC och alltsa\
  \ noll drift per konstruktion, sa korrigeringen saknar mening dar och skulle bli\
  \ en artificiell zonskillnad i hydrons marginalkostnad. Facit (run320/run386) ger\
  \ lambda konstant 72,87-73,02 i alla fem zoner. v7-filens egen not, rad 74, sager\
  \ samma sak.\nANVANDS SOM: --hydro-mc-curve config/terminal_curve_2040_gemini_v7_exp73.yaml\n\
  ⛔ --terminal-anchor 73 gor INTE samma sak: den flaggan laser bara den rullande horisontens\
  \ vag (run_model.py:915), medan --hydro-mc-curve (rad 2461) tar ankaret rakt ur\
  \ filen via load_params(). Darfor behovs den har filen.\n\n⭐⭐⭐ LAMBDA_BAS LAST FOR\
  \ EXPANSION 2026-08-22: 73 LIKFORMIGT. Inte langre en fri parameter.\nGRUND: lambda_bas\
  \ ar den ENDA av kurvans tre globala frihetsgrader som ar MATT i expansionens\n\
  eget regim. a_scale 0,30 och b_amp 0,27 ar anpassade (mot eSett resp. Geminis tabeller);\n\
  lambda_bas ar AVLAST ur facit run320 (73,02 i alla fem zoner och alla 13 152 timmar)\
  \ och\nrun386 (72,87). Facit ar en cyklisk fullframsynskorning = samma regim som\
  \ expansionen.\n\n⛔ SVEPETS 68,5 FAR INTE FOLJA MED. run378/379/380 valde 68,5 pa\
  \ RESERVOARDRIFTEN, som ar\nexakt 3x det arliga flodesunderskottet (samma matning,\
  \ inte tva). Cykliskt SOC tvingar\nstart = slut, sa driften ar IDENTISKT NOLL oavsett\
  \ lambda_bas -- observabeln som pekade ut\n68,5 finns inte i expansion. Samma skal\
  \ som utestanger de zonvisa ankarna 64,5-72,5.\n\nNIVAN ar dessutom nara inert:\
  \ run273-276 (p_nom_opt orort mellan VOM/30/60) och run377\n(mc 27-58 -> 73, my\
  \ 44,1 -> 1,1, effektivt bud andrat <3 EUR/MWh i alla fem zoner).\n⚠️ MEN INTE HELT:\
  \ kurvan ar MULTIPLIKATIV, mc = lambda_bas*A(v), sa lambda_bas skalar\nsasongsamplituden\
  \ i absoluta tal, och run381 visade att FORMEN inte ar inert (platt A(v):\nsol +5,5\
  \ GW, havsvind -1,0 GW). 68,5 mot 73 = 6,6 % amplitudskillnad, andra ordningen mot\n\
  a_scale 0,6->0,3 (50 %), men inte noll. Pasta aldrig att lambda_bas ar verkningslos\
  \ har.\n\n✅ BEKRAFTAT PA DET LASTA NATET 2026-08-22 -- UTAN NY KORNING. Fragan var\
  \ om 73, matt pa\ndet gamla natet (run320), overlever NTC-andringarna 2026-08-20\
  \ och 2026-08-22. Svaret ligger\ni tva befintliga facit-korningar pa OLIKA nat (NTC\
  \ lasta direkt ur network.nc, ej ur minnet):\n\n  korning   NO-N->SE-N  NO-N->NO-S\
  \  NO-N export  summa interna  lambda    uppl.\n  run320          1836        1773\
  \         3609              -   73,02      2h\n  run386          1500         700\
  \         2200         22 281   72,869     3h\n  IDAG            1800        1500\
  \         3300         23 181   ?          -\n\n1. lambda ar nastan OKANSLIGT for\
  \ NTC: NO-N:s export skars 3609 -> 2200 (-39 %) och lambda\n   rorde sig 0,15 enheter\
  \ (-0,2 %). Tva helt olika nat, samma svar.\n2. Dagens nat ligger INUTI intervallet\
  \ de tva spanner upp (NO-N export 3300 mellan 2200 och\n   3609) -- interpolation,\
  \ inte extrapolation.\n3. Dagens nat ligger dessutom MYCKET nara run386:s: +900\
  \ MW totalt (+4,0 %), och den storsta\n   enskilda andringen (NO-N<->NO-S 700 ->\
  \ 1500) gor lambda MER utjamnad, inte mindre.\n   run386 matte 72,87 pa det SNAVARE\
  \ natet.\n\nrun386:s water_value.csv ger EXAKT ETT varde, 72,869, i alla fem zoner\
  \ och alla timmar.\n⭐ Invariansen spanner ocksa en upplosningsandring (run320 2h,\
  \ run386 3h) -- stod for att\n  aven 4h skulle ge samma niva.\n\n⇒ 73 STAR. Om nagot\
  \ ligger sanningen marginellt under (72,87-73,02), men skillnaden ar under\nen tiondels\
  \ enhet och langt under upplosningen i kurvans ovriga frihetsgrader.\n\n⚠️ Vad som\
  \ INTE ar bevisat: att lambda forblir likformig ACROSS ZONES om nordliga NTC skulle\n\
  sankas VASENTLIGT under run386:s niva. Bada facit-korningarna gav likformigt lambda,\
  \ men bada\nlag i 2040-regimen. Se project-lambda-selection-effect: platt lambda\
  \ ar betingat pa att natet\nar utbyggt. Skulle NO-N<->NO-S ga tillbaka mot nutidens\
  \ 700 i ett framtida scenario maste\ndetta mataas om."
