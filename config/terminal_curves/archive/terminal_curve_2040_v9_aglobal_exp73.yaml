  <0,2 EUR/MWh, hydro -0,08 %, identiskt antal negativa timmar. Full framsyn ger a_scale = 0 vid optimum.'
note_expansion: "EXPANSIONSVARIANT av den NORMALISERADE A(v)-formen (2026-08-29). Identisk med\nconfig/terminal_curve_2040_v9_as129.yaml\
  \ sa nar som pa anchor_eur_per_mwh, som ar\n73 LIKFORMIGT i stallet for dispatchens driftkorrigering\
  \ 64,5-72,5.\nMOTIV: dispatchankarna ar en driftkorrigering for begransad framsyn. Expansionen har\n\
  cykliskt SOC och alltsa noll drift per konstruktion; korrigeringen skulle dar bli en\nartificiell zonskillnad\
  \ i hydrons marginalkostnad. Facit run320/run386 ger 73,02/72,87\nlikformigt i alla fem zoner och alla\
  \ timmar.\nANVANDS SOM: --hydro-mc-curve config/terminal_curve_2040_v9_aglobal_exp73.yaml\n\nVARFOR\
  \ DEN HAR KORNINGEN: A(v) ar den ENDA delen av kurvan som biter i expansion.\nhydro_mc_from_curve()\
  \ satter mc langs normalbanan dar P(x_ref) = 1, sa mc = lambda_bas*A(v)\noch HELA b-familjen (b_mean,\
  \ b_amp, b_low_frac, b_peak) ar inert. run381 visade att en\nPLATT A(v) flyttar sol +5,5 GW och havsvind\
  \ -1,0 GW, sa formen ar inte inert har aven om\nnivan nastan ar det.\n\nKONTROLL: run420_baseline_2h,\
  \ som kordes mot terminal_curve_2040_gemini_v7_exp73.yaml.\nDen ar i EXPANSION bit-identisk med v8_exp73\
  \ och v9_exp73 (b_mean och b_amp ar inerta,\na_amp/a_scale/x_ref/ankare ororda mellan v7, v8 och v9),\
  \ och bar den ZONVISA A-formen med\neffektiv amplitud a_scale*a_amp = 0,0915 (NO-S) till 0,1605 (FI).\n\
  Den har filen ar en ENFAKTORANDRING mot den: formen uniformiserad, amplituden satt till\nSE-N:s 0,12939,\
  \ dvs mitt i det zonvisa spannet. Skillnaden som mats ar alltsa RENT formen.\n\nDISPATCHUNDERLAGET (1h-dispatch\
  \ av run420_baseline_2h, alla utom kurvfilen identiska):\n  kriterium          bamp0 (zonal)  aglobal\
  \ 0,129  as065 0,065  as000 0\n  Sum|fel| B                  7,95           7,79         7,55     7,65\n\
  \  budkurva 20-60             2,958          2,937        2,983    2,926\n  v/s SE/NO/FI     1,428/1,251/0,727\
  \  1,456/1,228/0,718  1,486/1,279/0,749  1,545/1,327/0,772\n  Sum|fel| v/s               0,499     \
  \     0,560        0,508    0,549\n  i band SE/NO/FI       94/94/65 %     90/98/65 %   94/90/63 %  94/83/63\
  \ %\n  drift TWh                   3,36           3,79         3,39     3,32   (mal +3,13)\n  poang\
  \ score()              0,545          0,611        0,561    0,607\nI DISPATCH ar hela svepet nastan\
  \ inert: medelpris ror sig <=0,28 EUR/MWh, hydro 0,01 %,\nnegativa timmar 5372 -> 5383. Bara prissvansen\
  \ syns (h>100: 19 027 -> 14 572 nar A plattas).\nUniformiseringen kostar 0,066 i poang mot den zonvisa\
  \ kontrollen; halverad a_scale tar\ntillbaka nastan hela den forlusten. INGEN a_scale i svepet slar\
  \ dock den zonvisa formen.\n\nVARNING: argumentet som en gang satte a_scale = 0,30 (run384: SE:s v/s\
  \ LAG for lagt, 1,18\nmot 1,38) har VANT TECKEN i dagens regim. SE ligger nu pa 1,43-1,55, alltsa OVER\
  \ malet, och\nstiger nar a_scale sanks. Att fortsatta nedat argumenterar numera MOT v/s SE, samtidigt\
  \ som\ndet hjalper NO och FI.\n"
