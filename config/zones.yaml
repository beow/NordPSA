# NordPSA zone definitions
# Hydro p_nom and max_hours are initial estimates — to be calibrated against eSett data.
# NTC capacities based on approximate published values; adjust as needed.

zones:
  SE-N:
    mbas: [SE1, SE2]
    hydro_p_nom_mw: 13300   # SvK/Energiföretagen 2024: SE1 5.2 + SE2 8.1 GW (var 11500)
    hydro_max_hours: 2180   # 29.0 TWh reservoarvolym bevarad (13300×2180); var 2522×11500
    hydro_soc_initial: 0.62   # ~62% fyllnadsgrad 1 jan (SE1+SE2, faktiskt 3-årssnitt ENTSO-E A72; var 0.70)
    nuclear_p_nom_mw: 0

  SE-S:
    mbas: [SE3, SE4]
    hydro_p_nom_mw: 2900    # SvK/Energiföretagen 2024: SE3 2.6 + SE4 0.3 GW (var 2000)
    hydro_max_hours: 1207   # 3.5 TWh reservoarvolym bevarad (2900×1207); var 1750×2000
    hydro_soc_initial: 0.55   # ~55% fyllnadsgrad 1 jan (SE3+SE4 snitt)
    nuclear_p_nom_mw: 6900   # Forsmark 1-3 + Ringhals 3-4

  NO-N:
    mbas: [NO3, NO4]
    hydro_p_nom_mw: 11000
    hydro_max_hours: 2727   # 30.0 TWh reservoar (NVE NO3+NO4)
    hydro_soc_initial: 0.70   # ~70% fyllnadsgrad 1 jan
    nuclear_p_nom_mw: 0

  NO-S:
    mbas: [NO1, NO2, NO5]
    hydro_p_nom_mw: 22000
    hydro_max_hours: 2609   # 57.4 TWh reservoar (NVE NO1+NO2+NO5)
    hydro_soc_initial: 0.70   # ~70% fyllnadsgrad 1 jan
    nuclear_p_nom_mw: 0

  DK:
    mbas: [DK1, DK2]
    hydro_p_nom_mw: 0
    hydro_max_hours: 0
    nuclear_p_nom_mw: 0

  FI:
    mbas: [FI]
    hydro_p_nom_mw: 3200           # ~3.2 GW total installerad (Fingrid/Wikipedia 2022)
    hydro_max_hours: 1719          # 5.5 TWh magasinsvolym (5.5e6/3200; Åbo Akademi-review); var 500 (1.6 TWh, okalibrerad placeholder från initial commit)
    hydro_ror_fraction: 0.33       # ~1/3 av FI:s vattenkraftsENERGI är run-of-river (ej reglerbar); splittas till must-run (formad efter avrinning, glättad till CF~0.5), reservoaren får resten + hela lagervolymen
    hydro_soc_initial: 0.65   # ~65% fyllnadsgrad 1 jan
    nuclear_p_nom_mw: 4400   # Loviisa 1-2 + Olkiluoto 1-3

# Syntetisk kärnkrafts-tillgänglighet. Delade Monte-Carlo-parametrar för alla zoner;
# antal reaktorer + seed anges per zon (befintlig: nuclear_synth_existing nedan;
# ny: --add-nuclear ZON:N:SEED). Forcerad felrat lambda_fail härleds så att årlig
# medel-CF ≈ target_cf.
nuclear_synth:
  target_cf: 0.85
  mttr_hours: 120                    # medel reparationstid forcerat avbrott (~5 dygn)
  maintenance_window_doy: [105, 273] # revisionsfönster, ~15 apr – 30 sep
  maintenance_days: [25, 45]         # uniform min/max revisionslängd (dygn)
  revision_frequency: annual         # annual | biennial
  min_load_frac: 1.0                 # p_min_pu = min_load_frac × p_max_pu (1.0 = must-run)
  mw_per_reactor: 1500               # --add-nuclear: tak p_nom_max = N × detta (MW/reaktor)

# Befintlig kärnkraftsflotta → syntetisk profil i EXPANSIONSLÄGE (när --add-nuclear anges).
# Kapaciteten tas från zones.nuclear_p_nom_mw; här anges bara antal reaktorer + seed per
# zon för tillgänglighetskurvans form. Dispatchkörningar (utan --add-nuclear) använder
# istället faktisk-data-profilen.
nuclear_synth_existing:
  SE-S: {n_reactors: 6, seed: 101}   # Forsmark 1-3, Ringhals 3-4, Oskarshamn 3 (≈6,9 GW)
  FI:   {n_reactors: 5, seed: 103}   # Olkiluoto 1-3, Loviisa 1-2 (≈4,4 GW)

# Continental market connections: [name, zone, p_nom_mw, price_bzn]
# name format: "<Nord zone> <counterpart>" — becomes the PyPSA generator name
# price_bzn: Energy Charts bidding zone code used as marginal cost signal
# Positive flow = import (zone buys), negative flow = export (zone earns).
market_connections:
  - [FI EE,   FI,   1016, EE]
  - [SE-S LT, SE-S,  700, LT]
  - [SE-S PL, SE-S,  600, PL]
  - [SE-S DE, SE-S,  615, DE-LU]
  - [DK DE,   DK,   3244, DE-LU]
  - [DK NL,   DK,    700, NL]
  - [DK GB,   DK,   1456, GB]
  - [NO DE,   NO-S, 1400, DE-LU]
  - [NO NL,   NO-S,  640, NL]
  - [NO GB,   NO-S, 1449, GB]

# Effektiv kapacitet = P80 av faktiska fysiska flöden 2024 (ENTSO-E), dvs en
# proxy för flow-based-krympning i korrelerade exporttimmar. Aktiveras med
# --effective-ntc på run_model.py (default: märkkapacitet ovan).
market_connections_effective_mw:
  FI EE:    928
  SE-S LT:  733
  SE-S PL:  597
  SE-S DE:  617
  DK DE:   2480
  DK NL:    697
  DK GB:   1098
  NO DE:   1399
  NO NL:    620
  NO GB:   1450

# Pris-elasticitet vid kontinentgränserna — UNDERLAG för pristrappa i expansion.
# EJ INKOPPLAT ÄNNU (ingen kod läser detta; enabled=false).
# S = prisspread (€/MWh) vid full NTC: hur mycket gränspriset rör sig när Norden
# pressar flödet. Empiriskt förankrat i 2023-2025 prisspread per gräns (median av
# |P_utland − P_nord| när gränsen binder, dvs spread öppnar). Asymmetriskt:
# export ≫ import eftersom Norden är strukturellt billig (dumpar i dyr grannmarknad).
# VARNING: 2023-2025 var gaskris-era → kontinenten strukturellt dyr; S_export i
# överkant. Skala ner (t.ex. ×0.6) eller använd framtidsprisbana för framåtblickande
# scenarier. Nyckel = market_connections-namn.
market_elasticity:
  enabled: false
  n_tiers: 3                              # steg per riktning
  offset_profile: [0.1667, 0.5, 0.8333]   # {1/6,1/2,5/6}·S (mittpunkts-approximation)
  spread_eur_per_mwh:        # per gräns: export-spread / import-spread (€/MWh vid full NTC)
    FI EE:   {export: 59, import: 15}
    SE-S LT: {export: 44, import:  6}
    SE-S PL: {export: 64, import: 10}
    SE-S DE: {export: 50, import:  7}
    DK DE:   {export: 16, import:  6}
    DK NL:   {export: 21, import:  5}
    DK GB:   {export: 28, import: 13}
    NO DE:   {export: 38, import: 16}
    NO NL:   {export: 38, import: 14}
    NO GB:   {export: 44, import: 15}

# Fjärrvärmesektor (v3 "1 buss + laster"): bara FJÄRRVÄRME får en optimeringsnod
# (där flexibiliteten bor). Per zon: heat-Bus + Load(FV-värmebehov, termiskt, profil ur
# heat_load.parquet skalad till dh_demand_twh) + Store(ackumulator) + Link el-panna (η≈1)
# + Link stor-VP (COP) + Generator bio/KVV (konkurrerande MC) + slack.
# DUBBELRÄKNING: el_input_twh = dagens el IN i FV (el-panna+VP) som redan ligger i eSett-
# lasten → dras bort ur AC-lasten (proportionellt mot värmeprofilen), bussen återinför
# elen endogent. Aktivera med --add-heat. SE-tal: demand=EM 45 TWh (SE-S 40/SE-N 5);
# el_input ~3-4 TWh ANTAGANDE (förfinas mot EM-bränslemix). Byggnads-VP+industri = laster.
heat:
  enabled: false
  cop: 3.0                          # stor-VP COP (konstant tills v. temp-beroende)
  mustrun_share: 0.41               # avfall+avfallsgas+restvärme+rökgaskond (~0 MC, must-run);
  mustrun_vom_eur_per_mwh: 0.0      #   EM-bränslemix 2024: 20.4+1.9+8.0+11.2 = 41.5% — avlastar AC
  bio_vom_eur_per_mwh: 28.0         # bio/KVV (bio 45.9%) — dispatchbart mellanskikt, sätter el-tröskeln
  el_tax_eur_per_mwh: 35.0          # energiskatt på el (~0.39 SEK/kWh) på FV-el (panna+VP) → per MWh el
  elboiler_vom_eur_per_mwh: 0.5
  hp_vom_eur_per_mwh: 0.5
  store_hours: 6                    # ackumulator = store_hours × topplast (fast läge, om zonen saknar store_gwh)
                                    # per-zon store_gwh (i heat.zones) överstyr → explicit fast lagervolym i GWh_th
  store_extendable: false           # --heat-store-ext slår på (modellen dimensionerar lagret)
  store_overnight_eur_per_kwh: 0.5  # TES grop-/tanklager (DEA ~0.3-3 €/kWh_th)
  store_lifetime_years: 40
  store_fom_fraction: 0.01
  store_e_nom_max_mwh: 20000        # 20 GWh_th tak per zon (var ~obegränsat; lagren blev orimligt stora)
  slack_eur_per_mwh: 3000
  zones:                            # SE: EM-bränslemix 2024; DK: Dansk Fjernvarme 2022 + DEA 2024 (NO≈0; FI senare)
    # chp: bakpress-KVV, c=eta_el/eta_heat≈0.45 (svensk KVV värmefokuserad). SE-S CHP-el ~8.6 TWh
    # (korrigerar thermal-under-rep 5→~8 ≈ verklig SE-S-KVV); SE-N ~1 ≈ thermal. share_of_thermal 1.0.
    SE-N: {dh_demand_twh:  5.0, el_input_twh: 0.15, hp_el_mw:  40, elboiler_mw:  80, store_gwh:   5,
           chp: {eta_el: 0.25, eta_heat: 0.55, fuel_vom: 22.0, share_of_thermal: 1.0}}   # HP/panna ~6.7%/0.8%
    SE-S: {dh_demand_twh: 40.0, el_input_twh: 1.25, hp_el_mw: 300, elboiler_mw: 600, store_gwh:  20,
           chp: {eta_el: 0.25, eta_heat: 0.55, fuel_vom: 22.0, share_of_thermal: 1.0}}
    # DK: levererat ~30 TWh; el-panna-DOMINANT (4% panna / 1% VP), COP 4, must-run 0.25 (avfall 22%+sol 3%).
    #     chp: bakpress-KVV (multi-output Link bränsle→el+värme). Ersätter heat-only-bio + DK must-run-termisk
    #     (share_of_thermal 1.0 → all DK-termisk endogen via KVV; korrigerar under-rep. ~3 vs ~10 TWh).
    #     c=eta_el/eta_heat≈0.48 (DK ~10 TWh el / ~21 TWh värme). Första version — kalibreras.
    DK:   {dh_demand_twh: 30.0, el_input_twh: 1.3, hp_el_mw: 80, elboiler_mw: 400, cop: 4.0, mustrun_share: 0.25, store_gwh: 20,
           chp: {eta_el: 0.26, eta_heat: 0.54, fuel_vom: 22.0, share_of_thermal: 1.0}}
    # FI (Finsk Energi "District heating 2024", first version): konsumtion 32.7 TWh; VP/återvinning 7.8 TWh (~22%,
    #   FI elektrifierar hårt); KVV-andel 37% (ner från 76%), DH-KVV-el 4.5 TWh. NYCKEL: FI-thermal (12.3 TWh i
    #   modellen) domineras av INDUSTRI-KVV (skogsbruk) → share_of_thermal 0.37 (bara DH-KVV endogen, ~4.5 TWh;
    #   industri-KVV ~7.8 stannar must-run). c aggregerat lågt (DH-KVV + värme-bara-pannor). KALIBRERAS.
    FI:   {dh_demand_twh: 33.0, el_input_twh: 2.0, hp_el_mw: 450, elboiler_mw: 200, cop: 3.0, mustrun_share: 0.15, store_gwh: 100,
           chp: {eta_el: 0.16, eta_heat: 0.76, fuel_vom: 22.0, share_of_thermal: 0.37}}

# Fordonsladdning (EV smart charging). Antal fordon per zon anges via CLI --add-ev.
# Per-fordon-tal = PLATSHÅLLARE (nordiska medel) att trimma. Bara smart laddning (ingen V2G).
ev:
  enabled: false
  mode: svk                         # svk = SvK-formulering (flex/oflex-split); fleet = gammal per-fordon-modell
  flex_fraction: 0.5                # andel av förbrukningen som är flyttbar (SvK: hälften laddar flexibelt)
  flex_battery_gwh_per_twh: 12      # LMA26 §4.5.1: 12 GWh per TWh, appliceras på flex-TWh → flex-batteri = 12 × flex-TWh (LMA26 MM: 31,2 flex-TWh × 12 = 375 GWh, Figur 11). Med modellens konservativa 44,2 TWh EV: 22,1 flex-TWh × 12 = 265 GWh, laddtak 265/10h = 26,5 GW (30 kWh/flexibelt fordon = halva 60 kWh-packet). (8.48 var dubbelfel: halverade redan-flex 375 OCH delade med för-låg flex-TWh)
  charge_hours: 10                  # SvK: laddtid → flex-laddeffekt = flexbatteri / charge_hours
  morning_soc_floor: 0.7            # SOC-golv (e_min_pu) kl morning_soc_hour → tvingar daglig laddning
  morning_soc_hour: 6               # bryter perfekt-framsyn-flerdygnscoast (0 = inget golv)
  slack_eur_per_mwh: 3000           # omött mobilitet (sista utväg)
  classes:
    # annual_mwh används i båda lägen (E_tot = antal × annual_mwh). battery_kwh/charger_kw
    # används BARA i fleet-läget; charge_efficiency ignoreras i svk-läget (SvK räknar grid-side).
    car:   {battery_kwh: 60,  annual_mwh: 2.5, charger_kw: 7,   charge_efficiency: 0.90}
    heavy: {battery_kwh: 400, annual_mwh: 120, charger_kw: 150, charge_efficiency: 0.90}

# Interconnections: [zone_from, zone_to, capacity_mw]
# Capacity applies in both directions.
links:
  - [NO-N, SE-N,  1836]   # q95 faktiska scheduled exchanges NO4↔SE1 + NO4↔SE2 + NO3↔SE2 2023-25 (var 1600)
  - [SE-N, SE-S,  7600]   # q95 faktiska scheduled exchanges SE2↔SE3 2023-25 (var 7300; flödesbaserat lyfter taket)
  - [SE-N, FI,    1550]   # pre-Aurora q95 faktiska SE1↔FI 2023-24 (var 1200; Aurora live slutet 2025 → 2000 nedan)
  - [NO-N, NO-S,  1773]   # q95 faktiska scheduled exchanges NO3↔NO1/NO5 2023-25 (var 1300; config var för låg)
  - [NO-S, SE-S,  1674]   # q95 faktiska scheduled exchanges NO1↔SE3 2023-25 (var 2120; config var för hög)
  - [NO-S, DK,    1681]
  - [SE-S, DK,    2007]   # q95 faktiska scheduled exchanges SE4↔DK2 + SE3↔DK1 (Konti-Skan) 2023-25 (var 2015)
  - [SE-S, FI,    1200]

# Tidsdimension via körtyp: dispatch (--no-expansion) modellerar historiska 2023-2025
# och använder NTC ovan; expansionskörningar modellerar framtida system och får
# post-utbyggnads-NTC nedan (appliceras i run_model.py när expansion är på).
# Aurora-linjen (SE-N–FI) togs i drift slutet 2025: 1200 (historisk) → 2000 (expansion).
links_expansion_overrides:
  - [SE-N, FI,    2000]   # Aurora post-go-live

# Dagens (befintliga) batterier — laddas som FRIA (capital_cost=0, sunk) i dispatch/
# dagens-värld-körningar (dvs när INGET --demand-scenario är aktivt). I demand-scenario-
# körningar representeras batteriflottan i stället av scenariots egna 'battery:'-poster,
# så baseline hoppas då över (undviker dubbelräkning). [zon, MW, timmar].
baseline_batteries:
  - [SE-S, 1500, 2]
  - [FI,    500, 2]
  - [DK,    400, 2]

# Ytterligare fast last per zon (MW) — t.ex. för att emulera datacenter.
# Default: ingen extra last. Använd --extra-load <MW> på run_model.py för att lägga till.

# Driftrestriktioner på RESERVOARvattenkraften (REN OPTION, default av).
# Aktiveras med --hydro-restrictions. Hindrar LP:ns två orealistiska ytterligheter:
# (a) att stänga av vattenkraften helt under långa lågprisperioder — små magasin i
# älvsystemen skulle svämma över; (b) att köra maxeffekt vecka efter vecka, ett
# vanligt utfall i ELLI-liknande modeller.
# Alla andelar avser RESERVOARDELENS p_nom (efter ev. RoR-split), inte hela flottan.
hydro_operation:
  active: false
  min_hourly_frac: 0.10    # min timproduktion / installerad reservoareffekt
  min_daily_frac:  0.20    # min dygnsproduktion / maximal dygnsproduktion
  max_weekly_frac: 0       # 0 = inget globalt tak; sätts per zon nedan (provenienser skiljer sig)
  # Källa: Ek Fälth m.fl. (2025), supplementary material (docs/hydro_restrictions.pdf),
  # Figur A.2 "Sustained capacity", scenariot Present regime, 1 vecka. Avläsning ur
  # violinplottar → osäkerhet ca ±2–3 procentenheter. Studien täcker BARA Sverige.
  # Per prisområde: SE1 0.77, SE2 0.87, SE3 0.77. Aggregeras till NordPSA-zoner viktat
  # med installerad vattenkraft (SE1 5.2 / SE2 8.1 / SE3 2.6 / SE4 0.3 GW).
  # Kontroll: samma viktning på hela Sverige ger 0.82 mot figurens ~0.84 → viktningen håller.
  max_weekly_frac_by_zone:
    SE-N: 0.83   # KÄLLA: SE1 0.77 + SE2 0.87, kapacitetsviktat
    SE-S: 0.77   # KÄLLA: SE3 (SE4 saknar värde i studien, 0.3 GW → försumbart)
    NO-N: 0.85   # ⚠️ ANTAGANDE: ej i studien. Reservoartimmar 3148 h mot SE-N 2723 h
    NO-S: 0.85   # ⚠️ ANTAGANDE: ej i studien. Reservoartimmar 3131 h; högfallsverk med
                 #   stora magasin direkt uppströms → bör hålla minst SE-N:s nivå
    FI:   0.80   # ⚠️ ANTAGANDE: ej i studien. Reservoartimmar 2363 h, lågfallsverk med
                 #   små magasin (1/3 av energin redan avskild som RoR) → närmare SE-S
  # ⚠️ Alternativ tolkning: Figur A.3 "Sustained production" mäter veckoENERGI och är
  # formellt närmare detta villkor än A.2 (som mäter uthållig EFFEKT). Den ger SE-N 0.85,
  # SE-S 0.80. Värdena ovan följer A.2 eftersom referenstexten anger 0.77 för SE1, vilket
  # är A.2-siffran. A.2 är den konservativa (hårdare) av de två.
  # ⚠️ Stark säsongsvariation i Figur A.4 (SE1: ~72 % i mars, ~91 % i maj–juni) fångas INTE
  # av ett årskonstant tak. Kräver månadsvis tak — ej implementerat.
  # Spill förbi mindre stationer, som krävs för att hålla hög produktion länge.
  # Linjärt gångjärn: Σ_vecka spill ≥ coefficient × (Σ_vecka prod − tröskel), där
  # tröskel = (max_weekly_frac − threshold_below_max) × p_nom × veckans timmar.
  # ⚠️ Default AV: PyPSA:s spill är uppåt begränsad av tillrinningen i samma snapshot,
  # så en vecka med hög produktion men låg tillrinning kan bli INFEASIBLE. 'coefficient'
  # (MWh spill per MWh produktion över tröskeln) anges inte i källan — måste kalibreras.
  # κ kalibrerad mot Figur A.5 "Loss of total annual production" (Present regime, 1 vecka):
  # SE1 0.12 %, SE2 0.13 %, SE3 0.22 % av årsproduktionen per uthållig högprisvecka.
  # En vecka som ligger på taket överskrider tröskeln med threshold_below_max × p_nom × 168,
  # så κ = förlust × tillrinningsandel × 8760 / (threshold_below_max × 168).
  bypass_spill:
    active: false
    threshold_below_max: 0.10
    coefficient: 0.34          # fallback = SE-N
    coefficient_by_zone:
      SE-N: 0.34   # KÄLLA: A.5 SE1 0.12 % / SE2 0.13 %, tillrinningsandel 0.510
      SE-S: 0.59   # KÄLLA: A.5 SE3 0.22 %, tillrinningsandel 0.512
      NO-N: 0.30   # ⚠️ ANTAGANDE: ej i studien; stora magasin → mindre förbiledning
      NO-S: 0.30   # ⚠️ ANTAGANDE: som NO-N
      FI:   0.55   # ⚠️ ANTAGANDE: ej i studien; små magasin → nära SE-S

# Simulation period
snapshots:
  start: "2023-01-01"
  end:   "2026-01-01"   # exclusive, i.e. up to and including 2025-12-31
  resolution_hours: 2   # kanonisk expansions-baseline (run250-konfen); 1 = full timupplösning

# Technology costs
# discount_rate and fom_fraction apply to all technologies.
# capital_cost = overnight_eur_per_w * 1e6 * (CRF + fom_fraction)  [EUR/MW/yr]
costs:
  discount_rate: 0.06
  fom_fraction:  0.02   # fraction of overnight cost per year

  # Nätkostnad som kapital-adder per KRAFTSLAG × ZON (REN OPTION, default av).
  # Aktiveras med --grid-cost; internaliserar att olika kraftslag belastar nätet
  # olika (vind långt från lasten med låg CF drar mer nätutbyggnad per MW än
  # kärnkraft nära lasten). INGEN explicit 1/CF-faktor (låg CF straffas redan via
  # byggvolym); avstånd fångas av zone_factor. Debiteras BARA på INKREMENTET
  # (p_nom_opt − p_nom_min) för TILLKOMMANDE effekt — befintlig kapacitet bär noll
  # nätkostnad (dess nät är redan byggt). Gäller alla extendable kraftslag UTOM KVV
  # (KVV-carriers saknas i cost_eur_per_w → exkluderas automatiskt). Implementeras
  # som egen objektiv-term (grid_cost_objective i network.py, hjälpvariabel grid_inc
  # == p_nom − p_nom_min), SKILT från teknikens egen overnight (som per konvention
  # debiteras på hela p_nom_opt). active:false → ingen term, identiskt med idag.
  #
  # KALIBRERING (2026-06-23): addern = DJUP nätförstärkning (uppströms transmission
  # för att evakuera effekten), EJ radiell anslutning — den senare (NREL ATB grid
  # connection cost ~100 $/kW = spur line + interconnect) ligger redan i DEA-overnight,
  # och DEA-offshore (2.2 €/W) inkluderar exportkabel. cost_eur_per_w ankrat mot
  # Hirth/Ueckerdt (2015) "network cost"-komponent: ~100 €/kW vid 15-20 % vindandel
  # → 200 €/kW vid 40 %. Onshore 0.15 €/W ger 4.9 €/MWh (zon 1.0) → 7.4 €/MWh (SE-N),
  # mitt i Hirths 3.75-7.5 €/MWh-spann. Kärnkr/gas nära last ≈ 0.5 €/MWh (försumbart;
  # nätförstärkning är i praktiken ett VRE-fenomen).
  # ⚠️ zone_factor = lokaliseringssignal, JUDGMENT (ej hårdkalibrerad): norr =
  # produktionsöverskott långt från last → dyr nord-syd-transmission (Svk NordSyd
  # >100 mdr SEK för SE2↔SE3 7300→10500 MW); söder/DK = nära last/kontinent.
  #
  # FRAMTIDSVÄG (B, ej byggd): debitera förstärkning på NETTO-TOPP-INJEKTION per buss
  # (variabel peak_inj[zon] ≥ net_inj(t) ∀t, custom linopy-constraint) i st.f. på p_nom.
  # Då belönas co-lokaliserat batteri/peak-shaving (hybrid-solpark) endogent — plattare
  # injektion → lägre nätkostnad — utan att modellera enskilda parker. NACKDEL: kopplar
  # kapital till dispatch (det per-MW-addern undvek) + zon-aggregatet ≠ parks-anslutningstopp
  # i 6-zoners copper-plate. Passar bättre i spatiellt mer upplöst modell.
  grid:
    active: false             # --grid-cost flippar denna till true
    lifetime_years: 40        # nätinfrastrukturens livslängd
    fom_fraction:  0.02
    cost_eur_per_w:           # DJUP nätförstärkning per kraftslag (€/W), ej anslutning
      wind_onshore:  0.15     # Hirth ~150 €/kW djup förstärkning → 5-7 €/MWh
      wind_offshore: 0.20     # onshore-förstärkning UTÖVER DEA-inkluderad exportkabel
      solar:         0.05     # nära last + hybrid-batteri (peak-shaving kapar middags-
                              # injektionen → mindre djup förstärkning) → lägsta VRE-adder
      nuclear:       0.04     # fast, nära last, hög CF → minimal förstärkning
      gas:           0.04
      battery:       0.05
    zone_factor:              # lokaliserings-multiplikator (default 1.0); JUDGMENT
      SE-N: 1.5               # SE1+SE2: NordSyd-stråket, långt till last
      NO-N: 1.6               # mest avlägset, svagt nät
      FI:   1.4               # nord, Aurora-begränsningar
      SE-S: 1.0               # SE3+SE4: nära last (referens)
      NO-S: 1.1               # nära last men fjord/terräng
      DK:   0.9               # platt, tätt nät, nära kontinent

  nuclear:
    overnight_eur_per_w: 7.0
    lifetime_years: 60
    vom_eur_per_mwh: 20.0
    extendable: true
    p_nom_max_mw: 20000    # max utbyggnad per zon

  wind_onshore:
    overnight_eur_per_w: 1.2      # DEA ~1.04-1.13 ✓
    lifetime_years: 30            # DEA-kalib (var 25)
    vom_eur_per_mwh: 1.6          # DEA
    fom_fraction: 0.011           # DEA ~12.6 €/kW/år (global 2% = 24 var ~2× för högt → hindrade vind)
    extendable: true
    p_nom_max_mw: 50000

  wind_offshore:
    overnight_eur_per_w: 2.2      # DEA ~1.9-2.3 inkl nät (var 2.5)
    lifetime_years: 30            # DEA-kalib (var 25)
    vom_eur_per_mwh: 3.0
    fom_fraction: 0.018           # DEA ~40 €/kW/år
    extendable: true
    p_nom_max_mw: 50000

  solar:
    overnight_eur_per_w: 0.40     # DEA ~0.40 utility (var 0.5, ~25% högt)
    lifetime_years: 35            # DEA-kalib (var 30)
    vom_eur_per_mwh: 1.0
    fom_fraction: 0.019           # DEA ~7.5 €/kW/år
    extendable: true
    p_nom_max_mw: 50000

  gas:
    overnight_eur_per_w: 0.45     # OCGT (var 2.0, 2-4× för högt); peaker → VOM dominerar
    lifetime_years: 30            # (var 40)
    vom_eur_per_mwh: 100.0        # bränsle + CO2-proxy
    fom_fraction: 0.04            # OCGT ~18 €/kW/år
    extendable: true
    p_nom_max_mw: 20000

  hydro:
    vom_eur_per_mwh: 0.6        # reservoarkraft (lagringsvärde)
    vom_ror_eur_per_mwh: 0.5    # run-of-river (must-run, lägre än reservoar)
    extendable: false   # hydro capacity fixed; no new reservoirs

  # Värmeförsörjning (--add-heat). extendable=true → modellen dimensionerar mot
  # dessa kostnader i expansion; --no-expansion låser dem (som alla costs.*).
  # overnight anges per MW OUTPUT; koden konverterar till komponentens p_nom-enhet:
  #   heat_pump   (€/W_th) ×COP   → per MW_el (Link-p_nom)
  #   heat_elboiler (€/W_th) ×η   → per MW_el (Link-p_nom)
  #   heat_chp    (€/W_el) ×η_el  → per MW_fuel (Link-p_nom)
  #   heat_bio    (€/W_th) =      per MW_th (Generator-p_nom, bara icke-CHP-zoner)
  heat_pump:
    overnight_eur_per_w: 0.85   # DEA stor central VP (per MW_värme)
    lifetime_years: 25
    fom_fraction: 0.03
    extendable: true
    p_nom_max_mw: 10000         # MW_el per zon
  heat_elboiler:
    overnight_eur_per_w: 0.12   # elektrodpanna (per MW_värme)
    lifetime_years: 25
    fom_fraction: 0.03
    extendable: true
    p_nom_max_mw: 10000         # MW_el per zon
  heat_chp:
    overnight_eur_per_w: 4.0    # biobränsle-CHP per MW_el (DEA/Gemini 3-6)
    lifetime_years: 25
    fom_fraction: 0.03
    extendable: true
    p_nom_max_mw: 40000         # MW_fuel per zon
  heat_bio:
    overnight_eur_per_w: 0.6    # heat-only biopanna (per MW_värme)
    lifetime_years: 25
    fom_fraction: 0.03
    extendable: true
    p_nom_max_mw: 20000         # MW_th per zon

  # Li-ion (LFP) utility-scale. Tvådelad kostnad: effektdel (€/kW på p_nom,
  # växelriktare/BOP/nät) + energidel (€/kWh × max_hours, celler). Near-term,
  # mellan DEA 2030 (142 €/kWh / 160 €/kW) och NREL ATB 2024. Kort livslängd.
  # overnight €/MW = (power_eur_per_kw + max_hours × energy_eur_per_kwh) × 1000
  battery:
    energy_eur_per_kwh: 180
    power_eur_per_kw:   150
    lifetime_years:     15
    fom_fraction:       0.025
    p_nom_max_mw:       50000   # tak per zon för expanderbara batterier

  # Vätgas (power-to-X). Elektrolys (el→H2), Store-lager (energi €/kWh, effekt via
  # länkar), valfri turbin (H2→el). Allt i MWh LHV. overnight: el/turbin €/kW,
  # lager €/kWh. efficiency = verkningsgrad (LHV). Kalibrerat mot DEA 2030
  # (Technology Data, korsverifierat mot PyPSA technology-data), 2026-06-07.
  hydrogen:
    # Alkalisk elektrolysör, 100 MW-skala (DEA 2030: 575 €/kW, 66% LHV, FOM 4%)
    electrolyser: {overnight_eur_per_kw: 575, lifetime_years: 25, fom_fraction: 0.04, efficiency: 0.66}
    # Vätgas-OCGT som peaker (DEA OCGT 2030: 435 €/kW, 41% el-verkningsgrad)
    turbine:      {overnight_eur_per_kw: 435, lifetime_years: 25, fom_fraction: 0.03, efficiency: 0.41}
    # Lager per zon enligt geologi: default bergrum/ståltank (urberg, DEA ~5 €/kWh);
    # zoner med saltdomer (DK) får billig saltkavern (DEA ~0.5 €/kWh).
    store:
      overnight_eur_per_kwh: 5          # default: bergrum/ståltank (SE/NO/FI urberg)
      overnight_eur_per_kwh_by_zone:    # geologiska undantag
        DK: 0.5                         # saltdomer → saltkavern
      lifetime_years: 30
      fom_fraction:   0.02
      e_nom_max_mwh:  500000            # 500 GWh tak per zon för expanderbart lager
    slack_eur_per_mwh:    3000     # omött H2 / dyr import — sista utväg
    electrolyser_p_min_pu: 0.0     # min last (0 = helt flexibel)

# Kostnadsscenarier för expansionskörningar (SvK Långsiktig marknadsanalys 2026,
# 2024 års prisnivå). Väljs med --cost-scenario svk_2040 | svk_2050 → run_model
# skriver över cfg['costs'] per teknik. Byggränta (IDC): overnight' = OC·(1 +
# build_years/2·r); fom_fraction = fast_DoU/overnight' (bevarar absolut O&M).
# Råvärden: oc_eur_per_kw (tab 30 OIC), fom_eur_per_kw (tab 31 fast DoU),
# build_years (tab 29), lifetime_years (tab 29), vom_eur_per_mwh (SRMC = bränsle
# tab 9 / η + rörlig DoU tab 32; η_kärn 0.33 → kärnkr 1.7/0.33 + 3.8 ≈ 9.0). I
# dessa scenarier representerar tekniken 'gas' (carrier
# 'gas') CCGT-CCS i st.f. OCGT — vom = full SRMC (bränsle + rest-CO2 + CTS + O&M;
# antaganden η_CCS 0.50, fångst 90%, ef_gas 0.20, CTS 20 €/t). Hydro/heat/H2
# behåller sina DEA-värden ovan; dispatch-basblockets gas (OCGT) är orört.
cost_scenarios:
  # Dagens (2025) kostnadsnivå, LMA26 Tabell 30 (OIC) / 31 (fast DoU) / 32 (rörlig DoU),
  # 2025-kolumnen, 2024 års prisnivå. Batteri-split (power/energy) anpassad så alla tre
  # varaktigheter reproduceras: 2h≈1013, 4h=1670, 8h≈2984 EUR/kW (Tab30). Gas=CCGT-CCS,
  # vom = SRMC med 2030 bränslepriser (Tab9: naturgas 23.5, CO2 136.9 → 63.7 €/MWh).
  svk_2025:
    wind_onshore:  {oc_eur_per_kw: 1410, fom_eur_per_kw:  30.0, build_years: 1, lifetime_years: 25, vom_eur_per_mwh: 0.1}
    wind_offshore: {oc_eur_per_kw: 3350, fom_eur_per_kw: 102.5, build_years: 3, lifetime_years: 25, vom_eur_per_mwh: 0.1}
    solar:         {oc_eur_per_kw:  873, fom_eur_per_kw:   9.2, build_years: 1, lifetime_years: 30, vom_eur_per_mwh: 0.1}
    nuclear:       {oc_eur_per_kw: 8000, fom_eur_per_kw:  95.3, build_years: 7, lifetime_years: 60, vom_eur_per_mwh: 9.0}   # LMA26 6500 → höjt till 8000 (2025-nivån bedöms låg); FOM oförändrad
    gas:           {oc_eur_per_kw: 3000, fom_eur_per_kw:  65.0, build_years: 4, lifetime_years: 40, vom_eur_per_mwh: 63.7}   # CCGT-CCS, 2030 bränsle
    battery:       {power_eur_per_kw: 356, energy_eur_per_kwh: 328.5, fom_fraction: 0.025, build_years: 1, lifetime_years: 15}
  svk_2040:
    wind_onshore:  {oc_eur_per_kw: 1320, fom_eur_per_kw: 30.0, build_years: 1, lifetime_years: 25, vom_eur_per_mwh: 0.1}
    wind_offshore: {oc_eur_per_kw: 2400, fom_eur_per_kw: 97.5, build_years: 3, lifetime_years: 25, vom_eur_per_mwh: 0.1}
    solar:         {oc_eur_per_kw:  495, fom_eur_per_kw:  7.3, build_years: 1, lifetime_years: 30, vom_eur_per_mwh: 0.1}
    nuclear:       {oc_eur_per_kw: 6250, fom_eur_per_kw: 95.3, build_years: 7, lifetime_years: 60, vom_eur_per_mwh: 9.0}
    gas:           {oc_eur_per_kw: 2300, fom_eur_per_kw: 52.5, build_years: 4, lifetime_years: 40, vom_eur_per_mwh: 72.0}   # CCGT-CCS
    battery:       {power_eur_per_kw: 317, energy_eur_per_kwh: 217, fom_fraction: 0.025, build_years: 1, lifetime_years: 15}
  svk_2050:
    wind_onshore:  {oc_eur_per_kw: 1295, fom_eur_per_kw: 30.0, build_years: 1, lifetime_years: 25, vom_eur_per_mwh: 0.1}
    wind_offshore: {oc_eur_per_kw: 2250, fom_eur_per_kw: 95.0, build_years: 3, lifetime_years: 25, vom_eur_per_mwh: 0.1}
    solar:         {oc_eur_per_kw:  434, fom_eur_per_kw:  7.0, build_years: 1, lifetime_years: 30, vom_eur_per_mwh: 0.1}
    nuclear:       {oc_eur_per_kw: 6000, fom_eur_per_kw: 95.3, build_years: 7, lifetime_years: 60, vom_eur_per_mwh: 9.0}
    gas:           {oc_eur_per_kw: 2180, fom_eur_per_kw: 45.0, build_years: 4, lifetime_years: 40, vom_eur_per_mwh: 73.0}   # CCGT-CCS
    battery:       {power_eur_per_kw: 292, energy_eur_per_kwh: 169, fom_fraction: 0.025, build_years: 1, lifetime_years: 15}

# Efterfrågescenarier för expansionskörningar (SvK LMA2026). Väljs med
# --demand-scenario svk_2040_mm → run_model adderar SvK:s 2026→2040-tillskott
# ovanpå dagens eSett-bas, fördelat på zoner och dekomponerat i:
#   extra_load_mw  — inflexibel platålast (datacenter + ny industri + H&S/förluster-tillväxt)
#   h2{...}        — vätgas: demand_mw (H2 LHV), electrolyser_mw (MW_el, fast), store_mwh (H2 LHV)
#   ev_cars        — EV-el som PERSONBILS-EKVIVALENTER (= total EV-el ÷ 2.5 MWh/bil); buntar
#                    in tung trafik → EJ fysisk flotta. KONSERVATIV nivå: Norden 44.2 TWh
#                    (17.68M bil-ekv ≈ ~13M personbils-EV + ~130k tunga), ~71% av LMA26 MM
#                    Figur 11 (62.5 TWh). Vald så landstotalerna håller MM-envelopen (SE 243 /
#                    NO 194 / FI 145 / DK 81 ≈ 663) — full MM-EV (62.5) skulle överskjuta med
#                    ~18 TWh (se run180 vs run170). Flexkvoten (ev.flex_battery_gwh_per_twh: 12)
#                    är LMA26-korrekt oberoende av totalen → 265 GWh flex / 26.5 GW laddtak.
#                    60 kWh batteriantagandet används EJ i svk-läget.
#   pnom_max_mw    — utbyggnadspotential (Bilaga B, TWh→MW via modell-CF) som p_nom_max-tak
# ntc_overrides    — NTC-höjningar till 2040 (Tabell 10), appliceras på cfg['links']
# ⚠️ Princip: ADDITIV (eSett-bas bevaras) → modell-2040 ≈ 8–13 TWh/land UNDER SvK absolut
#   (eSett-bas under SvK 2026; tillväxten är SvK-konsistent). Härlett i temp/svk2040mm_build.py.
# ⚠️ ANTAGANDEN (flaggade): zon-split inom land, H2/EV-TWh (utom SE H2=24, firm p12),
#   potential-zonandelar. Endast landstotaler + SE H2 är hårda SvK-tal.
demand_scenarios:
  svk_2040_mm:
    ntc_overrides:
      - [SE-N, SE-S, 10700]   # Snitt 2 / NordSyd 2040 (Tabell 10; var q95 7600)
      - [NO-S, SE-S,  2000]   # NO1↔SE3 2040 (var 1674)
      - [SE-S, DK,    2300]   # SE4↔DK2 + Konti-Skan 2040 (var 2007)
    # Kontinentkablar (market_connections) — matchas på namn, ej zonpar
    market_ntc_overrides:
      - [FI EE, 1700]         # FI↔EE 2040 (var 1016)
      - [DK DE, 4500]         # DK↔DE 2040 (Tabell 10; var 3244)
      - [NO NL, 700]          # NO-S↔NL 2040 (var 640)
      - [DK GB, 1400]         # DK↔GB 2040 (var 1456)
      - [NO GB, 1400]         # NO-S↔GB 2040 (var 1449)
    # Kärnkraft: befintlig flotta (zones.nuclear_p_nom_mw: SE-S 6,9 GW / FI 4,4 GW) finns
    # med by default. NY kärnkraft adderas via --add-nuclear ZON:N:SEED (syntetisk,
    # extendable). I expansionsläge går befintlig flotta över till syntetisk profil
    # (nuclear_synth_existing). Ingen exogen låsning längre.
    # Kontinentpriser skiftade till SvK 2040 MM-nivå: multiplikativ omskalning av
    # 2023-25-serien per bzn (behåller timform/väderkorrelation, byter nivå).
    # DE-LU/LT/PL = SvK p79; NL/GB/EE = ANTAGANDEN (NL≈DE, GB lägre, EE≈Baltikum).
    # ⚠️ Underplays 2040:s ökade volatilitet (metod 3 = äkta 2040-profil krävs för det).
    continent_price_eur_mwh: {DE-LU: 79, LT: 87, PL: 83, NL: 78, GB: 75, EE: 84}
    # Batterier EXOGENT (storskaliga, stödtjänst-drivna). SvK:s egen modell bygger 0
    # endogena batterier (Bilaga C: dagen-före-intäkter fångar ej stödtjänstvärdet) —
    # samma i vår modell. Storskalig MM 2040 (GW): SE 5.5 / DK 3.8 / FI 2.7 / NO 0.
    # ⚠️ Varaktighet 2h = ANTAGANDE (SvK anger bara effekt). Småskaliga sol-kopplade
    # batterier (SE 2.0/DK 0.9/FI 1.1/NO 1.5 GW) UTELÄMNADE (kräver tak-PV-koppling).
    zones:
      # SE +8 TWh allmän förbrukning (basgap: eSett-bas 127,3 < SvK 2026 ~136) → SE 2040
      # ≈ 243 TWh (= SvK MM SE). Split per eSett-andel SE-N 0,206 / SE-S 0,794 (⚠️ antagande).
      # VRE-potentialer (LMA2026, TWh→MW vid CF onshore ×1,30 / offshore ×1,10):
      # SE land: golv 50 / tak 100 TWh; hav: golv 0 / tak 63 (allt→SE-S); sol: golv 7,4 / tak 25.
      # Split SE→SE-N/SE-S efter install-andel (onshore 59/41, sol 5/95; ⚠️ antagande).
      # ⚠️ Tak/golv-MW förutsätter --onwind-capfac-increase 0.30 + --offwind-capfac-increase 0.10.
      SE-N:
        extra_load_mw: 4298   # 4110 + 188 (1,6 TWh basgap)
        h2: {demand_mw: 1356, electrolyser_mw: 2550, store_mwh: 29700}
        ev_cars: 1200000   # konservativ: SE EV 15 TWh × split 0.20 (~71% av LMA26 MM 21.1)
        pnom_max_mw: {wind_onshore: 20394, wind_offshore:     0, solar:  1282}
        pnom_min_mw: {wind_onshore: 10197, solar:   380}   # SE-golv (install on 10050/sol 134)
        battery: {p_nom_mw: 1000, hours: 2}
      SE-S:
        extra_load_mw: 4378   # 3653 + 725 (6,4 TWh basgap)
        h2: {demand_mw:  452, electrolyser_mw:  850, store_mwh:  9900}
        ev_cars: 4800000   # konservativ: SE EV 15 TWh × split 0.80 (~71% av LMA26 MM 21.1)
        pnom_max_mw: {wind_onshore: 14376, wind_offshore: 16283, solar: 24000}
        pnom_min_mw: {wind_onshore:  7188, solar:  7104}   # SE-golv (install on 7092/sol 2778 → +~4,3 GW sol)
        battery: {p_nom_mw: 4500, hours: 2}
        # Befintlig kärnkraft 6,9 GW (zones.nuclear_p_nom_mw). Ny endogen via --add-nuclear,
        # ny EXOGEN (SvK MM 1,5 GW) via --add-nuclear-fixed SE-S:3:500.
      # NO-N/NO-S kalibrerade mot Statnett "Medium forbruksutvikling" 2040 (ej SvK-split):
      # NO total 195 TWh = eSett-bas 138 + Δ56. Δ flat 28 (alm −5, kraftint +15, petrol +6,
      # datac +12), H2 +10, transport(EV) +18. Split NO-N 0.356/NO-S 0.644 = eSett-andel
      # (⚠️ ANTAGANDE — geografisk sektor-split ej upplöst; petroleum/datac/grön industri
      # har egen geografi). EV = konservativ NO 16.2 TWh (~74% av LMA26 MM 21.8); split som ovan. H2 10 TWh.
      # NO (LMA2026): land 30, hav 21 (allt→NO-S), sol 20 TWh. Split NO→NO-N/NO-S install-andel
      # (onshore 61/39, sol 6/94; ⚠️ antagande). Inga golv för NO/DK/FI (bara tak).
      NO-N:
        extra_load_mw: 1138
        h2: {demand_mw:  406, electrolyser_mw:  494, store_mwh: 14045}
        ev_cars: 2300000   # konservativ: NO EV 16.2 TWh × split 0.356 (~74% av LMA26 MM 21.8)
        pnom_max_mw: {wind_onshore:  5537, wind_offshore:     0, solar:  1672}
      NO-S:
        extra_load_mw: 2058
        h2: {demand_mw:  735, electrolyser_mw:  806, store_mwh: 22915}
        ev_cars: 4180000   # konservativ: NO EV 16.2 TWh × split 0.644 (~74% av LMA26 MM 21.8)
        pnom_max_mw: {wind_onshore:  3730, wind_offshore:  4866, solar: 21560}
      DK:
        # +913 MW (8 TWh) allmän förbrukning ovanpå tidigare 2968 → stänger basgapet:
        # eSett-bas 36,5 < SvK 2026 ~45. DK total 2040 ≈ 81 TWh (= SvK MM DK).
        extra_load_mw: 3881
        h2: {demand_mw:   75, electrolyser_mw:  200, store_mwh:  3960}
        ev_cars: 3600000   # konservativ: DK EV 9.0 TWh (~72% av LMA26 MM 12.45)
        pnom_max_mw: {wind_onshore:  6757, wind_offshore: 27127, solar: 32843}   # DK LMA2026: land 17/hav 107/sol 41 TWh
        battery: {p_nom_mw: 3800, hours: 2}
      FI:
        # +1370 MW (12 TWh) allmän förbrukning ovanpå tidigare 4452 → stänger basgapet:
        # eSett-bas 80,4 < SvK 2026 ~93. FI total 2040 ≈ 145 TWh (= SvK MM FI).
        extra_load_mw: 5822
        h2: {demand_mw:  913, electrolyser_mw: 1400, store_mwh:     0}   # 8,0 TWh/år (höjt från 678=5,9)
        ev_cars: 1600000   # konservativ: FI EV 4.0 TWh (~56% av LMA26 MM 7.13)
        pnom_max_mw: {wind_onshore: 28219, wind_offshore:  6686, solar: 33417}   # FI LMA2026: land 77/hav 21/sol 29 TWh
        battery: {p_nom_mw: 2700, hours: 2}
        # FI kärnkraft = befintlig 4400 MW (Olkiluoto 1-3 + Loviisa 1-2), must-run historisk
        # profil, ingen ny (SvK MM ny FI-kärnkraft ej medtagen — flaggat). Lägg ev. block här.

# Vätgassystem per zon (opt-in). Utelämna = ingen H2. CLI-motsvarighet: --add-h2.
# Exempel (avkommentera för att aktivera):
# hydrogen:
#   SE-S:
#     demand_mw: 500
#     electrolyser: {p_nom_mw: 1000, extendable: true}
#     store:        {e_nom_mwh: 50000, extendable: false}
#     turbine:      {p_nom_mw: 300, extendable: false}   # utelämna = ingen turbin

# Solver
solver:
  name: highs
  threads: 16
  solver: ipm          # interior point method — skalbar för stora LP
  run_crossover: "on"  # krävs för korrekt kapacitetsexpansion (vertex-lösning)
  ipm_optimality_tolerance: 1e-6   # ÅTER till 1e-6: lös IPM (1e-4) gav crossover en slarvig startpunkt
                                   # → "imprecise crossover" → dyr enkeltrådad simplex-städning (run145: ~3h).
                                   # Snävare IPM = ren crossover utan simplex-fallback = snabbare totalt (testas nästa run).
