name: nordpsa-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pypsa>=1.3        # the LP differs between PyPSA versions; verified against 1.3.0
  - linopy>=0.9
  - pandas>=2.1
  - numpy
  - scipy
  - pyarrow
  - requests
  - pytz
  - pyyaml
  - highspy>=1.15
  - matplotlib
  - pytest
  - jupyter
  - ipykernel
  - ipywidgets
  - pip
  - pip:
    - -e .
