[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nordpsa"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
nordpsa = "nordpsa.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nordpsa*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"
